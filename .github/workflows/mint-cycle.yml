name: Mint cycle (drain pending every 2 hrs)
# Safety-net drain. Oracle VM pm2 tz-mint is the primary 24/7 worker; this catches up when the
# VM is down or slow. Runs every 2 hours — uses ~1440 GH Actions min/month (within free tier).
# mint-now.yml handles immediate cockpit dispatches; this covers steady-state backlog.
# --once exits in <5s when queue is empty so idle runs are cheap after the 3-min setup.
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: mint-cycle
  cancel-in-progress: false
jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      # E-240: Cloudflare Workers AI = 10,000 free LLM calls/DAY, quota SEPARATE from Groq/Gemini.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # CH_API_KEY: the Companies House key existed in TAMAZIA-REBUILD/.env but was never in CI, so the
      # firm-identity resolver could never fill legal_name / company_number / registered_office.
      CH_API_KEY: ${{ secrets.CH_API_KEY }}
      # THE LLM KEYS WORK. THEY JUST NEVER REACHED THE MINT.
      # GROQ (500K tokens/day) and GEMINI both answer HTTP 200 on the current keys, but neither was a
      # GitHub secret, so the router got no key, fell through the whole chain, and landed on the most
      # rate-limited provider in the stack. That is the entire "we have many API keys and it still fails".
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      NIM_API_KEY: ${{ secrets.NIM_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      MINT_BUILD_TIMEOUT_MS: "720000"
      MINT_RECLAIM_AFTER_MIN: "16"
      MINT_CONCURRENCY: "3"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "24" }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: npm install --omit=dev || npm install || true
      - run: python -m pip install --quiet -r requirements.txt
      - run: echo "${{ secrets.ENV_B64 }}" | base64 -d > .env
      - name: Drain the mint queue
        run: |
          while IFS= read -r _l; do case "$_l" in '#'*|'') ;; *=*) export "${_l?}" 2>/dev/null || true ;; esac; done < .env 2>/dev/null || true
          node scripts/ensure-schema.js || true
          AUDIT_PAYLOAD_STORE=both node scripts/mint-worker.js --once --reclaim-startup
