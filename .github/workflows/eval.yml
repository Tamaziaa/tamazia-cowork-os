name: compliance-eval
on:
  pull_request:
    branches: [ main, compliance-ssot ]
  push:
    branches: [ compliance-ssot ]
jobs:
  legal-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Legal-QA harness (blocks regressions vs golden baseline)
        run: node eval/guardrails.js --check
      - name: Predicate-producibility gate (informational until ledger 3.3)
        run: node eval/predicate-gate.js || echo "::warning::orphan predicates present (expected until phase 3.2 adds producers)"
