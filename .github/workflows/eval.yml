name: compliance-eval
on:
  pull_request:
    branches: [ main, compliance-ssot ]
  push:
    branches: [ compliance-ssot ]
jobs:
  legal-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Legal-QA harness (blocks regressions vs golden baseline)
        run: node eval/guardrails.js --check
      - name: End-to-end engine scenarios
        run: node eval/e2e-engine.test.js
      - name: Universal-obligation layer assertions
        run: node eval/obligations.test.js
      - name: Framework-intel overlay assertions
        run: node eval/framework-intel.test.js
      - name: Detection-correctness (prohibit/inversion) assertions
        run: node eval/rulecheck-detection.test.js
      - name: Sub-sector tree assertions
        run: node eval/subsector.test.js
      - name: Node-exclusivity guard (no cross-sector law leaks)
        run: node eval/node-exclusive.test.js
      - name: Sector coverage-integrity (canonical reconciliation)
        run: node eval/sector-coverage.test.js
      - name: Nexus SSOT invariants
        run: node eval/nexus.test.js
      - name: Controlled-vocabulary SSOT invariants
        run: node eval/vocab.test.js
      - name: Tagged-law schema integrity
        run: node eval/law-schema.test.js
      - name: Registry detector assertions
        run: node eval/registry.test.js
      - name: Producer assertions
        run: node eval/producers.test.js
      - name: Predicate-producibility gate (UP-1, BLOCKING)
        run: node eval/predicate-gate.js
