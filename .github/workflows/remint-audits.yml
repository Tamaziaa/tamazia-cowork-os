name: Re-mint audits (manual)
# Re-mints every existing audit_pages row onto the current engine payload (word-level quotes, AI-citation
# table, data-viz inputs, public-archive fallback). Server-side so PageSpeed runs with the key and there is
# no shell time cap. Resumable + per-row fail-soft; safe to re-run.
on:
  workflow_dispatch:
    inputs:
      hashes:
        description: "comma-separated audit hashes to re-mint (blank = all stale)"
        required: false
        default: ""

concurrency:
  group: remint-audits
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  remint:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      # SENTRY. A dead-lettered mint means an audit a law firm was going to receive DOES NOT EXIST. That is the one
      # thing here worth waking someone for. DSN-gated: if the secret is unset this is a no-op, never a second
      # failure mode stacked on top of the first.
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install Python deps (pg8000 for DB shim)
        run: python -m pip install --quiet -r requirements.txt
      - name: Materialise .env from secret
        run: |
          echo "${{ secrets.ENV_B64 }}" | base64 -d > .env
          if ! grep -q '^PAGESPEED_API_KEY=' .env && [ -n "${{ secrets.PAGESPEED_API_KEY }}" ]; then
            echo "PAGESPEED_API_KEY=${{ secrets.PAGESPEED_API_KEY }}" >> .env
          fi
          if ! grep -q '^OPENPAGERANK_API_KEY=' .env && [ -n "${{ secrets.OPENPAGERANK_API_KEY }}" ]; then
            echo "OPENPAGERANK_API_KEY=${{ secrets.OPENPAGERANK_API_KEY }}" >> .env
          fi
      - name: Re-mint all stale audit rows
        env:
          HASHES_IN: ${{ inputs.hashes }}
        run: |
          while IFS= read -r _l; do case "$_l" in '#'*|'') ;; *=*) export "${_l?}" 2>/dev/null || true ;; esac; done < .env 2>/dev/null || true
          # THE ENGINE VERSION IS A PROPERTY OF THE CODE, NOT OF THE ENVIRONMENT.
          # .env carries COMPLIANCE_ENGINE_VERSION, and the loop above exports it AFTER the job env is applied. So a
          # stale value in the secret PINS a fresh checkout: v25 code built a payload stamped v24, the database gate
          # correctly rejected the row as a stale worker, and the mint failed with "audit_pages INSERT failed - no
          # row written". The stale-worker lock was defeated by the very thing it exists to detect.
          # E-273 re-asserted MINT_CONCURRENCY and MINT_BUILD_TIMEOUT_MS from the workflow and MISSED THIS ONE. An
          # env var that can rename the engine's own version is a footgun: it can make a fresh checkout look stale,
          # and a stale checkout look fresh. Unset it. The constant in compliance.js is the single source of truth.
          unset COMPLIANCE_ENGINE_VERSION
          echo "[engine] effective ENGINE_VERSION=$(node -e "process.stdout.write(require('./src/skills/S008-personalisation-engine/scanners/compliance.js').ENGINE_VERSION)")"
          export REMINT_HASHES="$HASHES_IN"
          # A4/IG2: heartbeat-wrap so this long server-side re-mint is visible in engine_runs
          # (engine_health / check-stuck-jobs). Fallback to a bare call so a heartbeat hiccup never blocks the re-mint.
          # This job legitimately runs for hours (timeout-minutes: 350), so lift the wrap's hung-step guard above the
          # job timeout — otherwise heartbeat.js' 20-min default would SIGKILL a healthy long re-mint at exit 124.
          export HEARTBEAT_WRAP_TIMEOUT_MS=21600000   # 6h, comfortably over the 350-min job cap
          node scripts/heartbeat.js wrap remint-audits -- node scripts/remint-audits.js || node scripts/remint-audits.js
