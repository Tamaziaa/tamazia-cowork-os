name: Shadow validate (compliance-ssot, zero prod risk)
# Mints a small golden sample through the compliance-ssot engine into audit_pages_shadow under a v9-shadow cache
# namespace. Prod audit_pages, prod scanner_cache (v8), the website renderer, and main are ALL untouched.
# Triggered by touching .shadow-trigger (controlled) or manual dispatch. Reversible: DROP TABLE audit_pages_shadow.
on:
  workflow_dispatch:
    inputs:
      hashes: { description: "comma-separated golden hashes", required: false, default: "" }
  push:
    branches: [ compliance-ssot ]
    paths: [ '.shadow-trigger' ]
concurrency: { group: shadow-validate, cancel-in-progress: false }
permissions: { contents: read }
jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AUDIT_TABLE: audit_pages_shadow
      COMPLIANCE_ENGINE_VERSION: v9-shadow
      AUDIT_PAYLOAD_STORE: neon
      MINT_BUILD_TIMEOUT_MS: "300000"
      DEFAULT_HASHES: "Wd0diK57,tY4JGaqQ,oVXQF41x,hd4miaDW,swm0stTZ,PHOIxv7S,x05wbxbc,n8fDbxyR"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { ref: compliance-ssot }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "24" }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: npm install --omit=dev || npm install || true
      - run: python -m pip install --quiet -r requirements.txt
      - run: echo "${{ secrets.ENV_B64 }}" | base64 -d > .env
      - name: Seed shadow rows from live (so the in-place re-mint has rows to update)
        env:
          HASHES_IN: ${{ inputs.hashes }}
        run: |
          while IFS= read -r _l; do case "$_l" in '#'*|'') ;; *=*) export "${_l?}" 2>/dev/null || true ;; esac; done < .env 2>/dev/null || true
          # THE ENGINE VERSION IS A PROPERTY OF THE CODE, NOT OF THE ENVIRONMENT.
          # .env carries COMPLIANCE_ENGINE_VERSION, and the loop above exports it AFTER the job env is applied. So a
          # stale value in the secret PINS a fresh checkout: v25 code built a payload stamped v24, the database gate
          # correctly rejected the row as a stale worker, and the mint failed with "audit_pages INSERT failed - no
          # row written". The stale-worker lock was defeated by the very thing it exists to detect.
          # E-273 re-asserted MINT_CONCURRENCY and MINT_BUILD_TIMEOUT_MS from the workflow and MISSED THIS ONE. An
          # env var that can rename the engine's own version is a footgun: it can make a fresh checkout look stale,
          # and a stale checkout look fresh. Unset it. The constant in compliance.js is the single source of truth.
          unset COMPLIANCE_ENGINE_VERSION
          echo "[engine] effective ENGINE_VERSION=$(node -e "process.stdout.write(require('./src/skills/S008-personalisation-engine/scanners/compliance.js').ENGINE_VERSION)")"
          H="$HASHES_IN"; [ -z "$H" ] && H="$DEFAULT_HASHES"
          Q=$(echo "$H" | sed "s/[^,]*/'&'/g")
          ./scripts/psql "$NEON_URL" -c "INSERT INTO audit_pages_shadow SELECT * FROM audit_pages WHERE hash IN ($Q) ON CONFLICT DO NOTHING;"
      - name: Shadow re-mint golden sample (writes ONLY audit_pages_shadow)
        env:
          HASHES_IN: ${{ inputs.hashes }}
        run: |
          while IFS= read -r _l; do case "$_l" in '#'*|'') ;; *=*) export "${_l?}" 2>/dev/null || true ;; esac; done < .env 2>/dev/null || true
          # THE ENGINE VERSION IS A PROPERTY OF THE CODE, NOT OF THE ENVIRONMENT.
          # .env carries COMPLIANCE_ENGINE_VERSION, and the loop above exports it AFTER the job env is applied. So a
          # stale value in the secret PINS a fresh checkout: v25 code built a payload stamped v24, the database gate
          # correctly rejected the row as a stale worker, and the mint failed with "audit_pages INSERT failed - no
          # row written". The stale-worker lock was defeated by the very thing it exists to detect.
          # E-273 re-asserted MINT_CONCURRENCY and MINT_BUILD_TIMEOUT_MS from the workflow and MISSED THIS ONE. An
          # env var that can rename the engine's own version is a footgun: it can make a fresh checkout look stale,
          # and a stale checkout look fresh. Unset it. The constant in compliance.js is the single source of truth.
          unset COMPLIANCE_ENGINE_VERSION
          echo "[engine] effective ENGINE_VERSION=$(node -e "process.stdout.write(require('./src/skills/S008-personalisation-engine/scanners/compliance.js').ENGINE_VERSION)")"
          export REMINT_HASHES="$HASHES_IN"; [ -z "$REMINT_HASHES" ] && export REMINT_HASHES="$DEFAULT_HASHES"
          echo "shadow-minting: $REMINT_HASHES"
          node scripts/heartbeat.js wrap shadow-validate -- node scripts/remint-audits.js || node scripts/remint-audits.js
          node eval/shadow-diff.js
