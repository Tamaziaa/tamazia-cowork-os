# E-217 (v22.5): PRIORITY-SECTOR REMINT — founder-authorised (GATE-REMINT, 11 Jul session).
# Queues paced batches of live-but-unverified priority-sector audits for a fresh v22.5 mint, then dispatches
# mint-now to drain. Batch size keeps each run inside crawl budgets and free LLM tiers. Run 'watchlist' FIRST
# after any engine version bump: it queues the ten-domain watch list + eight-firm matrix as canaries (S-195).
name: Remint priority sectors (v22.5)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "watchlist (canaries) or batch"
        required: true
        default: "watchlist"
        type: choice
        options: [watchlist, batch]
      batch:
        description: "batch size when mode=batch"
        required: false
        default: "40"
permissions:
  contents: read
  actions: write
concurrency:
  group: remint-priority
  cancel-in-progress: false
jobs:
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "24" }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: python -m pip install --quiet -r requirements.txt
      - run: echo "${{ secrets.ENV_B64 }}" | base64 -d > .env
      - name: Queue the remint batch
        env:
          MODE: ${{ inputs.mode }}
          BATCH: ${{ inputs.batch }}
        run: |
          while IFS= read -r _l; do case "$_l" in '#'*|'') ;; *=*) export "${_l?}" 2>/dev/null || true ;; esac; done < .env 2>/dev/null || true
          # THE ENGINE VERSION IS A PROPERTY OF THE CODE, NOT OF THE ENVIRONMENT.
          # .env carries COMPLIANCE_ENGINE_VERSION, and the loop above exports it AFTER the job env is applied. So a
          # stale value in the secret PINS a fresh checkout: v25 code built a payload stamped v24, the database gate
          # correctly rejected the row as a stale worker, and the mint failed with "audit_pages INSERT failed - no
          # row written". The stale-worker lock was defeated by the very thing it exists to detect.
          # E-273 re-asserted MINT_CONCURRENCY and MINT_BUILD_TIMEOUT_MS from the workflow and MISSED THIS ONE. An
          # env var that can rename the engine's own version is a footgun: it can make a fresh checkout look stale,
          # and a stale checkout look fresh. Unset it. The constant in compliance.js is the single source of truth.
          unset COMPLIANCE_ENGINE_VERSION
          echo "[engine] effective ENGINE_VERSION=$(node -e "process.stdout.write(require('./src/skills/S008-personalisation-engine/scanners/compliance.js').ENGINE_VERSION)")"
          if [ "$MODE" = "watchlist" ]; then
            node scripts/queue-priority-remint.js --watchlist
          else
            node scripts/queue-priority-remint.js --batch="$BATCH"
          fi
      - name: Dispatch mint-now to drain
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run mint-now.yml --repo ${{ github.repository }} || true
