name: Mint now (drain minting_queue fast)
# On-demand minter for the cockpit Audit Search bar AND scheduled fallback drain.
# Dispatched by /api/admin/audits/mint after enqueuing domains; also dispatched by mint-cycle.yml
# every 30 min as a safety net when the Oracle VM pm2 worker is slow or down.
# Drains the WHOLE pending queue in one run (--once exits when empty). Job timeout = 360 min
# (GH Actions max) so even a large batch of 200+ domains finishes without being SIGKILLed.
# Prior to this fix the 15-min timeout killed workers mid-build leaving 'minting' zombies forever.
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: mint-now
  cancel-in-progress: false   # queue back-to-back dispatches; never cancel a live mint
jobs:
  mint:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      # Per-build cap: PSI fix (PR #138) bounds scanSite at 90s; compliance + formatters add ~60s.
      # 3 min is a safe ceiling. Previous 5-min cap let a single slow site hold up the batch.
      MINT_BUILD_TIMEOUT_MS: "720000"
      # Reclaim zombie 'minting' rows left by any worker killed >16 min ago. Set below the old 30 min
      # default so that zombies from a previously killed GH Actions job (any run that used the old
      # 15-min timeout) are cleaned up immediately at the start of this run.
      MINT_RECLAIM_AFTER_MIN: "16"
      # CONCURRENCY 1 (was 3): the LLM grounding (sector/jurisdiction/disclosure extraction) runs on FREE providers
      # (Cloudflare/Groq/Gemini) that rate-limit hard on CONCURRENCY. At concurrency 3 a burst of simultaneous mints
      # 429'd ~99% of LLM calls (measured: 71 fail / 1 ok in 20 min), so every audit silently fell back to brittle
      # regex heuristics -> wrong sector (hotel->media), wrong jurisdiction, fabricated breaches. Serializing to 1
      # keeps each audit's LLM calls inside the free per-minute budget (groq recovers immediately when not hammered),
      # so grounding actually runs. Slower throughput, correct audits. Raise again only once a PAID fallover key
      # (ANTHROPIC_API_KEY) is present in ENV_B64 so free-tier 429s route to a provider that will not rate-limit.
      # E-271: SERIALISE. The engine now makes far more LLM calls per audit than it did when concurrency 3 was set:
      # classification + cross-verification + (new in v23.0) breach ADJUDICATION, batched over every finding. All three
      # draw on the same free-tier quota (Groq/Cloudflare), which rate-limits hard in parallel. Under 3-way concurrency
      # the VERIFIER is the one that loses the race, the payload lands with NO llm_verify, and the database gate quite
      # correctly throws the row away as a stub ("audit_pages INSERT failed - no row written"). We were not losing rows
      # to a write bug; we were losing them to 429s we inflicted on ourselves. One worker at a time turns a 429-storm
      # into successful calls. Slower per batch, but a slow audit that lands beats a fast one the database rejects.
      MINT_CONCURRENCY: "1"
      # LLM in-process concurrency 1 so a single audit's calls are also paced (free tiers 429 on simultaneous requests).
      LLM_MAX_CONCURRENCY: "1"
      # E-238: a JSON classification that has not answered in 12s is not coming. The 30s default meant a
      # rate-limited provider burned 30s x retries x 3 gate attempts, stalling every mint for minutes. The
      # gate still drops to the deterministic fallback on failure; it just stops WAITING so long to do it.
      LLM_TIMEOUT_MS: "12000"
      # E-240: Cloudflare Workers AI = 10,000 free LLM calls/DAY on a quota SEPARATE from Groq/Gemini.
      # The router auto-leads with it when both vars are present (E-239), so this alone lifts free LLM capacity ~200x.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: npm install --omit=dev || npm install || true
      # E-267: playwright must be resolvable AND its browser present, or the cookie collector silently returns null.
      # Install it explicitly (not just from the lockfile) and download chromium with its OS deps.
      - run: npm install playwright@1.61.1 --no-save || true
      # E-269: the browser needs OS shared libraries (libnss3, libatk...). 'playwright install --with-deps' apt-gets
      # them on ubuntu-latest, but the old '|| npx playwright install chromium' fallback silently installed a browser
      # with NO libraries when --with-deps hit any hiccup, so every launch died 'Host system is missing dependencies'
      # and the cookie collector fail-opened. Install the deps EXPLICITLY first, then the browser, and do not mask it.
      - run: sudo npx playwright install-deps chromium || sudo apt-get update && sudo apt-get install -y libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2 libpango-1.0-0 libcairo2 libatspi2.0-0 || true
      - run: npx playwright install chromium
      - run: python -m pip install --quiet -r requirements.txt
      - run: echo "${{ secrets.ENV_B64 }}" | base64 -d > .env
      # E-260: the cookie-evidence collector needs a real browser. This is the ONLY way to observe the actual PECR
      # breach (non-essential cookies set BEFORE consent), which no amount of HTML parsing can ever see.
      - name: Install Chromium for cookie evidence
        run: npx playwright install --with-deps chromium

      - name: Drain the mint queue
        run: |
          while IFS= read -r _l; do case "$_l" in '#'*|'') ;; *=*) export "$_l" 2>/dev/null || true ;; esac; done < .env 2>/dev/null || true
          node scripts/ensure-schema.js || true
          AUDIT_PAYLOAD_STORE=both node scripts/mint-worker.js --once --reclaim-startup

      - name: send-gate summary
        if: always()
        run: node scripts/send-gate-summary.js || true

      # E-215 (v22.5, P-103/S-193): CI success is no longer decoupled from output validity. If this run minted
      # >= 5 audits and fewer than half verified, the job goes RED and Telegram gets the quarantine reason mix.
      - name: verified-rate gate
        if: always()
        run: |
          while IFS= read -r _l; do case "$_l" in '#'*|'') ;; *=*) export "$_l" 2>/dev/null || true ;; esac; done < .env 2>/dev/null || true
          node scripts/mint-verified-gate.js
