name: Tamazia hourly intel pulse
# PhD-level analysis of the live pipeline every hour -> Slack + Telegram (summary + improvements + critical flags).
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}
concurrency:
  group: intel-pulse
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install Node deps
        run: npm install --omit=dev || true
      - name: Install Python deps (pg8000 for DB shim)
        run: python -m pip install --quiet -r requirements.txt
      - name: Materialise .env from secret
        run: echo "${{ secrets.ENV_B64 }}" | base64 -d > .env
      - name: Run intel pulse
        run: node scripts/heartbeat.js wrap intel-pulse -- node scripts/intel-pulse.js
